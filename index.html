<!-- HELIX DROP 3D – GAMERKIE EDITION -->

<div id="helix-drop-container">

  <!-- TOP CONTROL BAR -->
  <div id="hd-top-bar">

    <!-- LEFT BUTTONS -->
    <div class="hd-bar-group">
      <button type="button" class="hd-round-btn"
        onclick="restartHelixDrop()" title="Restart" aria-label="Restart">
        ↻
      </button>

      <button type="button" id="hd-fav-btn"
        class="hd-round-btn" onclick="toggleHelixFav()"
        title="Favourite" aria-label="Favourite">
        ♡
      </button>
    </div>

    <!-- GAME BRAND -->
    <div class="hd-brand">
      <img
        src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhz4nl9LrCAZfFj0wsnXFcOXnQRCuO1iqpnNiU9jOLGWch_BDEIqyZ0jT1WfVmMMvono7vNhW0Ofc8RaTZUS_WvBrrR2OgIgJASFUiCM-o-lVgijcG-GOm9D410YgWz_j6RBCBrM9w63-kg4oKr56ko8AN_1dasFBacH0ozb7sw9kWGuP830CIftG-Jet0/s320/1000276360.jpg"
        alt="Helix Drop 3D GamerKie Logo"
      />
      <span id="hd-game-title">HELIX DROP 3D</span>
    </div>

    <!-- RIGHT BUTTONS -->
    <div class="hd-bar-group">
      <button type="button" id="hd-fs-btn"
        class="hd-round-btn" onclick="toggleHelixFullscreen()"
        title="Fullscreen" aria-label="Fullscreen">
        <svg id="hd-fs-icon" viewBox="0 0 24 24"
          width="19" height="19" fill="none"
          stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>

      <button type="button" class="hd-round-btn"
        onclick="shareHelixDrop()" title="Share" aria-label="Share">
        <svg viewBox="0 0 24 24" width="19" height="19"
          fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <path d="m8.6 10.5 6.8-4"/>
          <path d="m8.6 13.5 6.8 4"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- HELIX DROP 3D GAME -->
  <iframe
    id="helix-drop-iframe"
    src="YOUR_HELIX_DROP_GITHUB_PAGES_URL"
    title="Helix Drop 3D - GamerKie Edition"
    allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"
    allowfullscreen>
  </iframe>

</div>

<style>
#helix-drop-container {
  position:relative !important;
  width:100% !important;
  max-width:100% !important;
  margin:0 !important;
  padding:0 !important;
  border:0 !important;
  border-radius:0 !important;
  box-shadow:none !important;
  display:flex !important;
  flex-direction:column !important;
  overflow:hidden !important;
  background:transparent !important;
  font-family:Arial,sans-serif !important;
  isolation:isolate;
}

#helix-drop-container * {
  box-sizing:border-box;
}

/* TOP BAR */
#helix-drop-container #hd-top-bar {
  position:relative !important;
  z-index:25 !important;
  width:100% !important;
  min-height:54px !important;
  height:54px !important;
  padding:0 12px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  background:#101528 !important;
  flex-shrink:0 !important;
}

#helix-drop-container .hd-bar-group {
  display:flex !important;
  align-items:center !important;
  gap:9px !important;
}

/* BRAND */
#helix-drop-container .hd-brand {
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:8px !important;
  min-width:0 !important;
}

#helix-drop-container .hd-brand img {
  width:36px !important;
  height:36px !important;
  border-radius:50% !important;
  object-fit:cover !important;
  border:1.5px solid #f5b916 !important;
  flex-shrink:0 !important;
}

#helix-drop-container .hd-brand span {
  color:#ffe875 !important;
  font-size:13px !important;
  font-weight:900 !important;
  letter-spacing:.5px !important;
  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
}

/* ROUND BUTTONS */
#helix-drop-container .hd-round-btn {
  width:36px !important;
  height:36px !important;
  min-width:36px !important;
  border-radius:50% !important;
  border:1px solid rgba(255,232,117,.75) !important;
  background:#1a2240 !important;
  color:#ffe875 !important;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  cursor:pointer !important;
  padding:0 !important;
  font-size:22px !important;
  font-weight:bold !important;
  transition:.15s ease;
}

#helix-drop-container .hd-round-btn:hover {
  background:#f5b916 !important;
  color:#070810 !important;
  transform:scale(1.06);
}

#helix-drop-container .hd-round-btn.is-fav {
  background:#ff2e55 !important;
  border-color:#ff2e55 !important;
  color:white !important;
}

/* GAME FRAME */
#helix-drop-container #helix-drop-iframe {
  width:100% !important;
  height:82vh !important;
  height:82dvh !important;
  min-height:520px !important;
  display:block !important;
  border:0 !important;
  outline:0 !important;
  margin:0 !important;
  padding:0 !important;
  background:#111 !important;
}

/* FULLSCREEN */
#helix-drop-container.is-fullscreen,
#helix-drop-container:fullscreen,
#helix-drop-container:-webkit-full-screen {
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  height:100dvh !important;
  max-width:none !important;
  max-height:none !important;
  margin:0 !important;
  padding:env(safe-area-inset-top,0px)
          env(safe-area-inset-right,0px)
          env(safe-area-inset-bottom,0px)
          env(safe-area-inset-left,0px) !important;
  z-index:2147483647 !important;
  background:#070810 !important;
}

#helix-drop-container.is-fullscreen #helix-drop-iframe,
#helix-drop-container:fullscreen #helix-drop-iframe,
#helix-drop-container:-webkit-full-screen #helix-drop-iframe {
  flex:1 1 auto !important;
  height:calc(100% - 54px) !important;
  min-height:0 !important;
}

/* MOBILE */
@media(max-width:600px) {
  #helix-drop-container #helix-drop-iframe {
    height:78vh !important;
    height:78dvh !important;
    min-height:460px !important;
  }

  #helix-drop-container .hd-brand span {
    font-size:10px !important;
    letter-spacing:0 !important;
  }

  #helix-drop-container .hd-brand img {
    width:32px !important;
    height:32px !important;
  }

  #helix-drop-container .hd-round-btn {
    width:33px !important;
    height:33px !important;
    min-width:33px !important;
  }

  #helix-drop-container .hd-bar-group {
    gap:5px !important;
  }

  #helix-drop-container #hd-top-bar {
    padding:0 7px !important;
  }
}
</style>

<script>
(function(){

  var container = document.getElementById("helix-drop-container");
  var iframe = document.getElementById("helix-drop-iframe");
  var favBtn = document.getElementById("hd-fav-btn");
  var fsIcon = document.getElementById("hd-fs-icon");

  var favKey = "gamerkie_helix_drop_favourite";

  var expandSvg =
    '<path d="M8 3H5a2 2 0 0 0-2 2v3"/>' +
    '<path d="M21 8V5a2 2 0 0 0-2-2h-3"/>' +
    '<path d="M3 16v3a2 2 0 0 0 2 2h3"/>' +
    '<path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';

  var exitSvg =
    '<path d="M8 3v3a2 2 0 0 1-2 2H3"/>' +
    '<path d="M21 8h-3a2 2 0 0 1-2-2V3"/>' +
    '<path d="M3 16h3a2 2 0 0 1 2 2v3"/>' +
    '<path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';

  /* FAVOURITE */
  try {
    if(localStorage.getItem(favKey)==="true") {
      favBtn.classList.add("is-fav");
      favBtn.textContent="♥";
    }
  } catch(e) {}

  window.toggleHelixFav = function() {
    var active = favBtn.classList.toggle("is-fav");
    favBtn.textContent = active ? "♥" : "♡";
    try {
      localStorage.setItem(favKey,active ? "true" : "false");
    } catch(e) {}
  };

  /* RESTART */
  window.restartHelixDrop = function() {
    if(!iframe) return;
    var url=iframe.src;
    iframe.src="about:blank";
    setTimeout(function(){
      iframe.src=url;
    },100);
  };

  /* SHARE */
  window.shareHelixDrop = function() {
    var data = {
      title:"HELIX DROP 3D - GamerKie Edition",
      text:"Play Helix Drop 3D free online on GamerKie!",
      url:window.location.href
    };

    if(navigator.share) {
      navigator.share(data).catch(function(){});
    } else if(navigator.clipboard) {
      navigator.clipboard.writeText(window.location.href)
        .then(function(){
          alert("Game link copied!");
        });
    } else {
      prompt("Copy game link:",window.location.href);
    }
  };

  /* FULLSCREEN */
  function syncIcon() {
    var active =
      !!(document.fullscreenElement ||
         document.webkitFullscreenElement ||
         container.classList.contains("is-fullscreen"));

    fsIcon.innerHTML = active ? exitSvg : expandSvg;
  }

  window.toggleHelixFullscreen = function() {

    if(container.classList.contains("is-fullscreen")) {

      container.classList.remove("is-fullscreen");
      document.body.style.overflow="";

      if(document.fullscreenElement ||
         document.webkitFullscreenElement) {

        var exit =
          document.exitFullscreen ||
          document.webkitExitFullscreen;

        if(exit) {
          try {
            var result=exit.call(document);
            if(result && result.catch) result.catch(function(){});
          } catch(e) {}
        }
      }

      syncIcon();
      return;
    }

    container.classList.add("is-fullscreen");
    document.body.style.overflow="hidden";
    syncIcon();

    var request =
      container.requestFullscreen ||
      container.webkitRequestFullscreen;

    if(request) {
      try {
        var result=request.call(container);
        if(result && result.catch) {
          result.catch(function(){});
        }
      } catch(e) {}
    }
  };

  document.addEventListener("fullscreenchange",function(){
    if(!document.fullscreenElement) {
      container.classList.remove("is-fullscreen");
      document.body.style.overflow="";
    }
    syncIcon();
  });

  document.addEventListener("webkitfullscreenchange",function(){
    if(!document.webkitFullscreenElement) {
      container.classList.remove("is-fullscreen");
      document.body.style.overflow="";
    }
    syncIcon();
  });

})();
</script>
